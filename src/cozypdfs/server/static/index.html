<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cozypdfs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>

<div id="library-view" class="view">
  <header class="lib-header">
    <div class="brand">
      <span class="brand-mark">&#128214;</span>
      <span class="brand-name">cozypdfs</span>
    </div>
    <button id="add-book-btn" class="btn btn-primary">+ Add book</button>
    <input id="file-input" type="file" accept="application/pdf" hidden>
  </header>
  <main class="lib-main">
    <div id="empty-state" class="empty-state" hidden>
      <div class="empty-icon">&#128214;</div>
      <p>Your library is empty.</p>
      <p class="empty-sub">Drag a PDF in, or click &ldquo;Add book&rdquo; to turn it into a proper ebook.</p>
    </div>
    <div id="book-grid" class="book-grid"></div>
  </main>
</div>

<div id="reader-view" class="view" hidden>
  <header class="reader-header">
    <button id="back-btn" class="icon-btn" title="Back to library">&#8592;</button>
    <div class="reader-title">
      <span id="reader-book-title"></span>
      <span id="reader-book-author" class="reader-author"></span>
    </div>
    <div class="reader-actions">
      <button id="toc-btn" class="icon-btn" title="Contents">&#9776;</button>
      <button id="settings-btn" class="icon-btn" title="Display settings">Aa</button>
      <a id="download-epub-link" class="icon-btn" title="Download EPUB" download>&#8595;</a>
    </div>
  </header>

  <div id="viewer-wrap">
    <button id="prev-btn" class="nav-zone nav-prev" aria-label="Previous page">&#8249;</button>
    <div id="viewer"></div>
    <button id="next-btn" class="nav-zone nav-next" aria-label="Next page">&#8250;</button>

    <aside id="toc-panel" class="side-panel" hidden>
      <h3>Contents</h3>
      <ul id="toc-list"></ul>
    </aside>

    <aside id="settings-panel" class="side-panel" hidden>
      <h3>Display</h3>
      <div class="setting-row">
        <span>Font size</span>
        <div class="stepper">
          <button id="font-dec" aria-label="Smaller text">A&#8722;</button>
          <span id="font-size-label">100%</span>
          <button id="font-inc" aria-label="Larger text">A+</button>
        </div>
      </div>
      <div class="setting-row">
        <span>Theme</span>
        <div class="theme-swatches">
          <button data-theme="light" class="swatch swatch-light" title="Light"></button>
          <button data-theme="warm" class="swatch swatch-warm" title="Warm paper"></button>
          <button data-theme="dark" class="swatch swatch-dark" title="Dark"></button>
        </div>
      </div>
      <div class="setting-row">
        <span>Layout</span>
        <div class="toggle-group">
          <button data-mode="paginated" class="toggle-btn" title="Turn pages">Paged</button>
          <button data-mode="scrolled" class="toggle-btn" title="Scroll continuously">Scroll</button>
        </div>
      </div>
    </aside>
  </div>

  <footer class="reader-footer">
    <div id="progress-bar"><div id="progress-fill"></div></div>
    <span id="progress-label"></span>
  </footer>
</div>

<div id="upload-modal" class="modal" hidden>
  <div class="modal-card">
    <div id="upload-stage-icon" class="upload-icon">&#128214;</div>
    <h2 id="upload-title">Adding your book&hellip;</h2>
    <ul id="upload-log" class="upload-log"></ul>
    <div id="upload-error" class="upload-error" hidden></div>
    <div id="upload-result" class="upload-result" hidden>
      <button id="read-now-btn" class="btn btn-primary">Read now</button>
      <a id="upload-download-link" class="btn btn-secondary" download>Download EPUB</a>
    </div>
    <button id="upload-close-btn" class="btn btn-text">Close</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js"></script>
<script src="/static/js/reader.js"></script>
<script src="/static/js/app.js"></script>
</body>
</html>
