[project]
name = "cozypdfs"
version = "0.1.0"
description = "Reconstructs novel PDFs into clean, reflowable EPUBs."
readme = "README.md"
authors = [
    { name = "ashanviii", email = "ashanviy@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ebooklib>=0.20",
    "fastapi>=0.141.1",
    "lxml>=6.1.3",
    "pymupdf>=1.28.2",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.53.0",
]

[build-system]
requires = ["uv_build>=0.11.22,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "reportlab>=5.0.1",
    "ruff>=0.16.8",
]
